name: Release NPM Package

on:
  release:
    types: [released]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npmjs

    permissions:
      packages: write
      id-token: write

    steps:
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: |
          npm dist-tag add @amtins/shiny-eureka@$(echo "${{github.ref_name}}" | cut -c 2-) latest
          exit 0
